name: samovar
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python>=3.10,<3.14
  - pip
  - cxx-compiler
  - make
  - zlib
  - pigz
  - snakemake-minimal>=7.0
  - numpy>=1.20
  - pandas>=1.3
  - pyyaml>=5.1
  - tqdm>=4.60
  - requests>=2.25
  - matplotlib>=3.5
  - seaborn>=0.12
  - scikit-learn>=1.6
  - altair>=5
  - ete3
  - biopython>=1.80
  - insilicoseq
  # Binary dependencies of samovaR and SparseDOSSA2 (./install.sh full).
  - r-base>=4.2
  - r-remotes
  - r-magrittr
  - r-dplyr
  - r-ggplot2
  - r-tibble
  - r-tidyr
  - r-forcats
  - r-stringr
  - r-plotly
  - r-httr
  - r-jsonlite
  - r-xml2
  - r-tsne
  - r-matrix
  - r-scclust
  - r-distances
  - r-htmlwidgets
  - r-progress
  - r-ggnewscale
  - r-yaml
  - r-ks
  - r-mvtnorm
  - r-huge
  - r-future
  - r-future.apply
  - r-truncnorm
  - r-igraph
  - r-rmpfr
  - pip:
      - cnsplots>=0.6.0
      - kaleido>=1
