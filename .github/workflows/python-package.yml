# Python package (install.sh)

name: Python package

# Checkout is the commit that triggered the run: a push installs that branch
# (main when the push is to main), a pull request installs the head branch.
on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v4
      with:
        repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
        ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    - name: Confirm checkout matches the triggering ref
      run: |
        expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
        echo "event=$GITHUB_EVENT_NAME ref=$GITHUB_REF sha=$GITHUB_SHA head=${GITHUB_HEAD_REF:-}"
        echo "expected=$expected HEAD=$(git rev-parse HEAD)"
        test "$(git rev-parse HEAD)" = "$expected"
    - uses: conda-incubator/setup-miniconda@v3
      with:
        python-version: ${{ matrix.python-version }}
        auto-update-conda: true
        activate-environment: samovar
        environment-file: environment.yml
    - name: Install via install.sh
      env:
        CI: "true"
        NCBI_EMAIL: test@samovar.com
        SAMOVAR_INSTALL_DEV: "1"
        SAMOVAR_UPDATE_SHELL: "0"
      run: |
        chmod +x install.sh
        ./install.sh
    - name: Lint with flake8 (critical)
      run: |
        flake8 src tests workflow bin \
          --count --select=E9,F821,F822,F823 --show-source --statistics
    - name: Test with pytest (mandatory suite)
      timeout-minutes: 30
      env:
        NCBI_EMAIL: test@samovar.com
      run: |
        pytest -m mandatory --tb=short --cov=src
