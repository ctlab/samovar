# Full pytest + example pipelines (separate jobs).
# Not used on ordinary PR/push (those run python-package.yml / mandatory tests).

name: Full integration

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: full-integration
  cancel-in-progress: false

env:
  CI: "true"
  NCBI_EMAIL: test@samovar.com
  SAMOVAR_INSTALL_DEV: "1"
  SAMOVAR_UPDATE_SHELL: "0"
  # remotes/gh otherwise use a revoked bundled PAT (HTTP 401). Valid GHA token if anything still hits the API.
  GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

jobs:
  pytest-full:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash -l {0}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: conda-incubator/setup-miniconda@v3
      with:
        python-version: "3.12"
        auto-update-conda: true
        activate-environment: samovar
        environment-file: environment.yml

    - name: System + conda deps (SparseDOSSA2 needs Rmpfr/libmpfr)
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libmpfr-dev libgmp-dev libcurl4-openssl-dev libssl-dev libxml2-dev gfortran
        conda install -y -c conda-forge -c bioconda \
          r-base r-essentials openjdk \
          r-rmpfr r-igraph r-huge r-ks r-mvtnorm r-truncnorm r-magrittr r-future.apply r-remotes \
          kraken2 kaiju

    - name: Install via install.sh full
      run: |
        chmod +x install.sh
        ./install.sh full

    - name: Verify SparseDOSSA2 from full install
      run: |
        python - <<'PY'
        from samovar.sparsedossa2 import sparsedossa2_available
        assert sparsedossa2_available(), "SparseDOSSA2 missing after ./install.sh full"
        print("SparseDOSSA2 OK")
        PY

    - name: Lint with flake8 (critical)
      run: |
        flake8 src tests workflow bin \
          --count --select=E9,F821,F822,F823 --show-source --statistics

    - name: All pytest (mandatory and optional)
      timeout-minutes: 120
      run: |
        pytest --tb=short --cov=src

  examples-toy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash -l {0}

    env:
      SAMOVAR_CORES: "2"
      SAMOVAR_GENERATE_CORES: "2"
      SAMOVAR_SD2_WORKERS: "2"
      SAMOVAR_N_SAMPLES: "2"
      SAMOVAR_N_READS: "200"
      SAMOVAR_MAX_GENOMES: "20"
      N_SAMPLES: "2"
      TOTAL_READS: "200"

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: conda-incubator/setup-miniconda@v3
      with:
        python-version: "3.12"
        auto-update-conda: true
        activate-environment: samovar
        environment-file: environment.yml

    - name: System + conda deps (SparseDOSSA2 needs Rmpfr/libmpfr)
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libmpfr-dev libgmp-dev libcurl4-openssl-dev libssl-dev libxml2-dev gfortran
        conda install -y -c conda-forge -c bioconda \
          r-base r-essentials openjdk \
          r-rmpfr r-igraph r-huge r-ks r-mvtnorm r-truncnorm r-magrittr r-future.apply r-remotes \
          kraken2 kaiju

    - name: Install via install.sh full
      run: |
        chmod +x install.sh
        ./install.sh full

    - name: Verify SparseDOSSA2 (multiple_tables needs it)
      run: |
        python - <<'PY'
        from samovar.sparsedossa2 import sparsedossa2_available
        assert sparsedossa2_available(), "SparseDOSSA2 missing after ./install.sh full"
        print("SparseDOSSA2 OK")
        PY

    - name: Examples (toy indexes)
      timeout-minutes: 90
      run: |
        bash examples/toy/pipeline.sh
        bash examples/scoring/pipeline.sh
        bash examples/reprofiling/pipeline.sh
        bash examples/multiple_tables/pipeline.sh
        SAMOVAR_TOY=1 bash examples/logistic-correction/pipeline.sh
        SAMOVAR_N_SAMPLES=4 bash examples/apply_and_merge/pipeline.sh

  examples-phage:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash -l {0}

    env:
      SAMOVAR_CORES: "2"
      SAMOVAR_GENERATE_CORES: "2"
      SAMOVAR_N_SAMPLES: "2"
      SAMOVAR_N_READS: "200"
      SAMOVAR_MAX_GENOMES: "20"
      N_SAMPLES: "2"
      TOTAL_READS: "200"

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: conda-incubator/setup-miniconda@v3
      with:
        python-version: "3.12"
        auto-update-conda: true
        activate-environment: samovar
        environment-file: environment.yml

    - name: Conda extras for full install and examples
      run: |
        conda install -y -c conda-forge -c bioconda \
          r-base r-essentials openjdk \
          kraken2 kaiju

    - name: Install via install.sh full
      run: |
        chmod +x install.sh
        ./install.sh full

    - name: Examples (phage + add-annotator)
      timeout-minutes: 90
      run: |
        bash examples/phage/pipeline.sh
        SAMOVAR_PHASE=add-annotator bash examples/phage/pipeline.sh

  examples-public:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash -l {0}

    env:
      SAMOVAR_CORES: "2"
      SAMOVAR_GENERATE_CORES: "2"
      SAMOVAR_N_SAMPLES: "2"
      SAMOVAR_N_READS: "200"
      SAMOVAR_MAX_GENOMES: "20"
      # Use phage_test indexes (built like examples/phage), not S3 standard/refseq.
      SAMOVAR_CI_LIGHT_INDEXES: "1"

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: conda-incubator/setup-miniconda@v3
      with:
        python-version: "3.12"
        auto-update-conda: true
        activate-environment: samovar
        environment-file: environment.yml

    - name: Conda extras for full install and examples
      run: |
        conda install -y -c conda-forge -c bioconda \
          r-base r-essentials openjdk \
          kraken2 kaiju

    - name: Install via install.sh full
      run: |
        chmod +x install.sh
        ./install.sh full

    - name: Examples (public pipelines on phage_test indexes)
      timeout-minutes: 150
      run: |
        bash examples/realistic/pipeline.sh
        bash examples/assembly/pipeline.sh
        bash examples/databases_comparison/pipeline.sh
