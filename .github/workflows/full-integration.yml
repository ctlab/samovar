# Full pytest uses ./install.sh full. Example jobs install only what those
# pipelines call (MultiQC; SparseDOSSA2 only for examples/multiple_tables).
# Not used on ordinary PR/push (those run python-package.yml / mandatory tests).
# checkout ref is the triggering commit: workflow_dispatch on a branch installs
# that branch; a run from main installs main; a release installs the tagged commit.

name: Full integration

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: full-integration
  cancel-in-progress: false

env:
  CI: "true"
  NCBI_EMAIL: test@samovar.com
  SAMOVAR_INSTALL_DEV: "1"
  SAMOVAR_UPDATE_SHELL: "0"
  # remotes/gh otherwise use a revoked bundled PAT (HTTP 401). Valid GHA token if anything still hits the API.
  GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

jobs:
  pytest-full:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash -l {0}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.sha }}
    - name: Confirm checkout matches the triggering ref
      run: |
        echo "event=$GITHUB_EVENT_NAME ref=$GITHUB_REF sha=$GITHUB_SHA"
        echo "HEAD=$(git rev-parse HEAD)"
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

    - uses: conda-incubator/setup-miniconda@v3
      with:
        python-version: "3.12"
        auto-update-conda: true
        activate-environment: samovar
        environment-file: environment.yml

    - name: Additional workflow tools
      run: |
        conda install -y -c conda-forge -c bioconda openjdk kraken2 kaiju

    - name: Install via install.sh full
      run: |
        chmod +x install.sh
        ./install.sh full

    - name: Verify SparseDOSSA2 from full install
      run: |
        python - <<'PY'
        from samovar.sparsedossa2 import sparsedossa2_available
        assert sparsedossa2_available(), "SparseDOSSA2 missing after ./install.sh full"
        print("SparseDOSSA2 OK")
        PY

    - name: Lint with flake8 (critical)
      run: |
        flake8 src tests workflow bin \
          --count --select=E9,F821,F822,F823 --show-source --statistics

    - name: All pytest (mandatory and optional)
      timeout-minutes: 120
      run: |
        pytest --tb=short --cov=src

  examples-toy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash -l {0}

    env:
      SAMOVAR_CORES: "2"
      SAMOVAR_GENERATE_CORES: "2"
      SAMOVAR_N_SAMPLES: "2"
      SAMOVAR_N_READS: "200"
      SAMOVAR_MAX_GENOMES: "20"
      N_SAMPLES: "2"
      TOTAL_READS: "200"

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.sha }}
    - name: Confirm checkout matches the triggering ref
      run: |
        echo "event=$GITHUB_EVENT_NAME ref=$GITHUB_REF sha=$GITHUB_SHA"
        echo "HEAD=$(git rev-parse HEAD)"
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

    - uses: conda-incubator/setup-miniconda@v3
      with:
        python-version: "3.12"
        auto-update-conda: true
        activate-environment: samovar
        environment-file: environment.yml

    - name: Install tools named by prepare
      run: |
        # methods.md after prepare for toy, scoring, reprofiling, logistic-correction, apply_and_merge:
        #   iss, snakemake, kraken2, kaiju, direct, shannon_ks, logistic
        #   reprofiling also names the imported reprofiler "linear" (Python, scikit-learn from environment.yml)
        # iss / snakemake / direct / shannon_ks / logistic come from ./install.sh (core).
        # kraken2 and kaiju are external annotators.
        # Every pipeline.sh then runs samovar multiqc.
        conda install -y -c conda-forge -c bioconda kraken2 kaiju
        chmod +x install.sh
        ./install.sh
        ./install.sh MultiQC

    - name: Examples (toy indexes)
      timeout-minutes: 90
      run: |
        bash examples/toy/pipeline.sh
        bash examples/scoring/pipeline.sh
        bash examples/reprofiling/pipeline.sh
        SAMOVAR_TOY=1 bash examples/logistic-correction/pipeline.sh
        SAMOVAR_N_SAMPLES=4 bash examples/apply_and_merge/pipeline.sh

  examples-sparsedossa:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash -l {0}

    env:
      SAMOVAR_CORES: "2"
      SAMOVAR_GENERATE_CORES: "2"
      SAMOVAR_SD2_WORKERS: "2"
      SAMOVAR_N_SAMPLES: "2"
      SAMOVAR_N_READS: "200"
      SAMOVAR_MAX_GENOMES: "20"
      N_SAMPLES: "2"
      TOTAL_READS: "200"

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.sha }}
    - name: Confirm checkout matches the triggering ref
      run: |
        echo "event=$GITHUB_EVENT_NAME ref=$GITHUB_REF sha=$GITHUB_SHA"
        echo "HEAD=$(git rev-parse HEAD)"
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

    - uses: conda-incubator/setup-miniconda@v3
      with:
        python-version: "3.12"
        auto-update-conda: true
        activate-environment: samovar
        environment-file: environment.yml

    - name: Install tools named by prepare
      run: |
        # methods.md after prepare:
        #   iss, snakemake, kraken2, kaiju, direct, bootstrap, glm,
        #   sparsedossa2-fit, sparsedossa2-stool, sparsedossa2-cv, logistic
        # R and binary package dependencies come from environment.yml.
        conda install -y -c conda-forge -c bioconda kraken2 kaiju
        chmod +x install.sh
        ./install.sh
        ./install.sh MultiQC SparseDOSSA2

    - name: Verify SparseDOSSA2
      run: |
        python - <<'PY'
        from samovar.sparsedossa2 import sparsedossa2_available
        assert sparsedossa2_available(), "SparseDOSSA2 missing after ./install.sh SparseDOSSA2"
        print("SparseDOSSA2 OK")
        PY

    - name: Example (multiple table generators)
      timeout-minutes: 90
      run: |
        bash examples/multiple_tables/pipeline.sh

  examples-phage:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash -l {0}

    env:
      SAMOVAR_CORES: "2"
      SAMOVAR_GENERATE_CORES: "2"
      SAMOVAR_N_SAMPLES: "2"
      SAMOVAR_N_READS: "200"
      SAMOVAR_MAX_GENOMES: "20"
      N_SAMPLES: "2"
      TOTAL_READS: "200"

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.sha }}
    - name: Confirm checkout matches the triggering ref
      run: |
        echo "event=$GITHUB_EVENT_NAME ref=$GITHUB_REF sha=$GITHUB_SHA"
        echo "HEAD=$(git rev-parse HEAD)"
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

    - uses: conda-incubator/setup-miniconda@v3
      with:
        python-version: "3.12"
        auto-update-conda: true
        activate-environment: samovar
        environment-file: environment.yml

    - name: Install tools named by prepare
      run: |
        # methods.md after prepare:
        #   database1: iss, snakemake, kraken2, kaiju, gc, kmer2, direct, shannon_ks, logistic
        #   database2: iss, snakemake, kraken2, kaiju
        # gc and kmer2 are samovar.gc / samovar.kmer2 (core). kraken2-build and kaiju index tools ship with the conda packages.
        conda install -y -c conda-forge -c bioconda kraken2 kaiju
        chmod +x install.sh
        ./install.sh
        ./install.sh MultiQC

    - name: Examples (phage)
      timeout-minutes: 90
      run: |
        bash examples/phage/pipeline.sh

  examples-public:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash -l {0}

    env:
      SAMOVAR_CORES: "2"
      SAMOVAR_GENERATE_CORES: "2"
      SAMOVAR_N_SAMPLES: "2"
      SAMOVAR_N_READS: "200"
      SAMOVAR_MAX_GENOMES: "20"
      # Use phage_test indexes (built like examples/phage), not S3 standard/refseq.
      SAMOVAR_CI_LIGHT_INDEXES: "1"

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.sha }}
    - name: Confirm checkout matches the triggering ref
      run: |
        echo "event=$GITHUB_EVENT_NAME ref=$GITHUB_REF sha=$GITHUB_SHA"
        echo "HEAD=$(git rev-parse HEAD)"
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

    - uses: conda-incubator/setup-miniconda@v3
      with:
        python-version: "3.12"
        auto-update-conda: true
        activate-environment: samovar
        environment-file: environment.yml

    - name: Install tools named by prepare
      run: |
        # config_init.yaml after prepare:
        #   realistic: kraken2, kaiju, iss, direct, shannon_ks
        #   assembly: those plus assembly with identity slots (no MegaHIT / GTDB-Tk / CoverM)
        #   databases_comparison: kraken2 only (two indexes), iss, direct, shannon_ks
        conda install -y -c conda-forge -c bioconda kraken2 kaiju
        chmod +x install.sh
        ./install.sh
        ./install.sh MultiQC

    - name: Examples (public pipelines on phage_test indexes)
      timeout-minutes: 150
      run: |
        # phage example imports phage_test; the pipelines below only generate/prepare/exec.
        bash examples/phage/pipeline.sh
        bash examples/realistic/pipeline.sh
        bash examples/assembly/pipeline.sh
        bash examples/databases_comparison/pipeline.sh
