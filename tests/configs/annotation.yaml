# exec
# snakemake -s workflow/annotators/Snakefile --configfile tests/configs/annotation.yaml --cores 1
#
# Point db_path at databases you built or downloaded (see examples/).
# Override by copying this file; nothing here should be a cluster-specific path.

# Input directories
r1_dir: "tests/data/reads"
r2_dir: "tests/data/reads"
output_dir: "tests_outs/workflows/annotation/initial_reports"

run_config:
- cmd: kaiju
  db_path: tests_outs/kaiju_db
  run_name: kaiju
  type: kaiju
- cmd: kraken
  db_path: tests_outs/kraken_db
  run_name: kraken
  type: kraken
- cmd: kraken2
  db_path: tests_outs/kraken_db
  run_name: kraken2
  type: kraken2
- cmd: krakenuniq
  db_path: tests_outs/krakenuniq_db
  run_name: krakenuniq
  type: krakenuniq
