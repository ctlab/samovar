# Hydra root for a SamovaR run snapshot (generate / prepare / exec).
# Saved copies live in $output_dir/.hydra/{config,overrides,hydra}.yaml
defaults:
  - _self_

samovar_version: ""
command: ""
stages: []

generate: {}
prepare: {}
exec: {}
viz:
  full: false
  opal: false
  metrics_sample: 0
  metrics: null
# Report sections are separate from viz (per-read metrics) and from visual style.
# CLI on `samovar multiqc` overrides this block. Names: qc, benchmark, correction,
# mag, profiles, composition, alpha, beta, feature_importance, table_scores.
# Beta-diversity concordance scorer. mantel is built in; a concordance tool name or a .py path replaces it.
concordance: mantel

multiqc:
  sections: all
  include: []
  exclude: []
  stages: all
  annotators: all

env: {}
tools: {}
imports: {}
databases: {}
custom_flags: []
warnings: []
